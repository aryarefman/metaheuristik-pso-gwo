name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  algorithms:
    name: PSO and GWO converge on every landscape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/test_algorithms.js

  build:
    name: built pages are up to date with src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - name: fail if index.html or pages/ differ from a fresh build
        run: git diff --exit-code -- index.html pages/
